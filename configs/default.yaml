# Defaults for every run. Stage configs inherit with `base: default.yaml`.
paths:
  data_dir: data
  results_dir: results

data:
  test_size: 10000       # fixed across seeds; bnlearn only (Adult uses the official adult.test)
  reference_size: 5000   # fixed across seeds; DOMIAS only
  binning_size: 2000     # Adult: fixed rows used only to fit bin edges, shared by every run
  val_fraction: 0.25     # val size = max(val_fraction * n, min_val_size)
  min_val_size: 200
  n_bins: 10             # K, same for every n and seed

structure:
  max_indegree: 3
  n_random_dags: 5

model:
  dim: 64
  n_heads: 4
  n_layers: 3
  dropout: 0.1

train:
  device: auto           # auto = cuda if available, else cpu
  hparam_seed: 0         # the grid is searched on this seed; other seeds reuse its choice
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 128
  max_epochs: 500
  patience: 20
  # Searched on validation NLL per (stage, dataset, n, variant) at hparam_seed.
  hparam_grid:
    lr: [1.0e-3, 3.0e-4]
    weight_decay: [0.0, 1.0]     # AdamW; 1e-2 had no effect at small n (PLAN 0.6)
    dropout: [0.1, 0.3]

baselines:
  bn_cpt:
    smoothing_grid:      # selected per run on validation NLL; fitting takes milliseconds
      - {prior: BDeu, equivalent_sample_size: 0.1}
      - {prior: BDeu, equivalent_sample_size: 1.0}
      - {prior: BDeu, equivalent_sample_size: 10.0}
      - {prior: BDeu, equivalent_sample_size: 100.0}
      - {prior: K2, equivalent_sample_size: 1.0}   # Laplace: +1 per cell
  bn_hdp:
    # Concentrations are fit by leave-one-out on train; their lower bound is selected per
    # run on validation NLL. LOO alone drives them to ~0 when a CPT row has no singletons.
    min_concentration_grid: [0.01, 0.3, 1.0, 2.0]

scsa:
  gate_hidden: 16
  aux_weight: 0.1        # lambda for the per-component auxiliary NLL

eval:
  support_buckets: [0, 1, 5, 20]   # zero / low / medium / high; fixed, do not tune
  n_mi_targets: 100                # members and non-members each
  fpr: 0.01
  tstr_target:
    adult: income
