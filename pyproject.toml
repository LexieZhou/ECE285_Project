[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabstruct"
version = "0.1.0"
description = "When does structure help generative models of small tables? (ECE 285 project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pgmpy>=1.1",  # pgmpy.causal_discovery
    "networkx>=3.0",
    "ucimlrepo>=0.0.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
baselines = ["sdv>=1.12"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
